name: Build and release Ember Firefox

on:
  push:
    branches: [ember-firefox]
    tags: ['ember-v*']
  pull_request:
    branches: [ember-firefox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, test and package
        run: npm run package
      - name: Verify generated source is committed
        run: git diff --exit-code -- src/interception.js
      - uses: actions/upload-artifact@v4
        with:
          name: OldTweetDeckFirefox-Ember
          path: artifacts/OldTweetDeckFirefox-Ember.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ember-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OldTweetDeckFirefox-Ember
          path: artifacts
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "$TAG" = "ember-v$version"
          notes=(--generate-notes)
          if [[ -f "docs/releases/$TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$TAG.md")
          fi
          gh release create "$TAG" artifacts/OldTweetDeckFirefox-Ember.zip --verify-tag --title "Ember Firefox $version" "${notes[@]}"
